name: 🔃 Sync branches

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is-valid-branch: ${{ steps.branch_check.outputs.is-valid-branch }}
    steps:
      - name: Check if branch name is 'main'
        id: branch_check
        run: |
          BRANCH_NAME=${{ github.ref }}
          if [[ $BRANCH_NAME =~ refs/heads/main ]]; then
            VALID=true
          else
            VALID=false
          fi

          echo "is-valid-branch=$VALID" >> $GITHUB_OUTPUT
  merge-branches:
    needs: check-branch
    permissions:
      contents: write
    if: needs.check-branch.outputs.is-valid-branch == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge into dev
        run: |
          SOURCE_BRANCH="main"
          TARGET_BRANCH="dev"
          # Set git config
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"


          echo "Merging $SOURCE_BRANCH into $TARGET_BRANCH"

          # Checkout the source branch
          git checkout $SOURCE_BRANCH
          git pull origin $SOURCE_BRANCH
          echo "Pulled latest for $SOURCE_BRANCH"

          # Merge into the target branch
          git checkout $TARGET_BRANCH
          git merge --no-ff $SOURCE_BRANCH -m "Merge $SOURCE_BRANCH into $TARGET_BRANCH"
          echo "Merged $SOURCE_BRANCH into $TARGET_BRANCH"

          # Push changes
          git push origin $TARGET_BRANCH
          echo "Pushed changes to $TARGET_BRANCH"
