name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      major: ${{ steps.gitversion.outputs.major }}
      majorMinor: "${{ steps.gitversion.outputs.major }}.${{steps.gitversion.outputs.minor }}"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore jcdcdev.Cloudflare.CustomListSync.sln

      - name: Build
        run: |
          dotnet build jcdcdev.Cloudflare.CustomListSync.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test jcdcdev.Cloudflare.CustomListSync.sln --configuration Release --no-build --verbosity normal

  docker:
    needs:
      - build-and-test
      - determine-version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE_NAME: "docker.io/${{ github.repository }}"
      DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME}}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.semVer }}
            type=sha
            type=raw,value=${{ needs.determine-version.outputs.majorMinor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.determine-version.outputs.major }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.determine-version.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: 🚀 create release
    needs:
      - determine-version
      - docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      SEMVER: ${{ needs.determine-version.outputs.semVer }}
    steps:
      - name: Create Release
        uses: jcdcdev/jcdcdev.GitHub.CreateRelease@v1
        with:
          version: ${{ env.SEMVER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
